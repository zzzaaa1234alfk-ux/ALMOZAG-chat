:root{--main:#00d4ff;--bg:#010a1e;--card:#0a234a;--input:#001e3d}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100dvh}
body{background:var(--bg);color:#fff;font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;overflow:hidden;transition:.3s}
.bg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:900;color:rgba(0,212,255,0.06);transform:rotate(-28deg);letter-spacing:10px;pointer-events:none;z-index:0;user-select:none}
.header{padding:10px 12px;text-align:center;border-bottom:2px solid var(--main);background:#001233;z-index:2;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.header h1{color:var(--main);font-size:18px}
.header .left{display:flex;gap:6px}
.hbtn{background:#0a1e3a;border:1px solid var(--main);color:var(--main);font-size:11px;padding:5px 9px;border-radius:12px;cursor:pointer}
.chat{flex:1;overflow-y:auto;padding:12px 12px 20px;max-width:1400px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:10px;z-index:2}
.msg{max-width:86%;padding:12px 16px;border-radius:18px;line-height:1.7;font-size:14px;white-space:pre-wrap;word-break:break-word;cursor:pointer;position:relative}
.msg.user{align-self:flex-start;background:linear-gradient(135deg,var(--main),#0066ff)}
.msg.bot{align-self:flex-end;background:var(--card);border:1px solid rgba(0,212,255,0.2)}
.msg.bot .actions{margin-top:8px;display:flex;gap:6px}
.msg.bot .actions button{font-size:10px;padding:4px 8px;border-radius:10px;border:1px solid var(--main);background:transparent;color:var(--main);cursor:pointer}
.msg img{max-width:220px;border-radius:12px;margin-top:8px;display:block;border:2px solid var(--main)}
.bottom{flex-shrink:0;background:#00102a;border-top:2px solid var(--main);padding:8px 8px max(8px,env(safe-area-inset-bottom));z-index:999}
.bar{max-width:1400px;margin:0 auto;display:flex;gap:8px;align-items:center;width:100%}
.icon{width:42px;height:42px;flex-shrink:0;background:#0a1e3a;border:1px solid var(--main);border-radius:50%;color:var(--main);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
.box{flex:1;background:var(--input);border:2px solid var(--main);border-radius:24px;padding:8px 14px;display:flex;min-height:44px;max-height:110px}
.box textarea{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:15px;resize:none;height:22px;max-height:90px;font-family:inherit}
.send{width:46px;height:46px;flex-shrink:0;background:linear-gradient(135deg,var(--main),#0066ff);border:none;border-radius:50%;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.send.rec{animation:pulse 1s infinite;background:linear-gradient(135deg,#ff0044,#aa0033)}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.preview{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.preview img{width:70px;height:70px;object-fit:cover;border-radius:10px;border:2px solid var(--main)}
.keyBox,.themeBox{position:fixed;top:60px;left:10px;right:10px;max-width:400px;margin:auto;background:#001a3a;border:2px solid var(--main);border-radius:15px;padding:14px;z-index:10000;display:none}
.keyBox input{width:100%;padding:10px;border-radius:10px;border:1px solid #00d4ff55;background:#000e2a;color:#fff;margin:8px 0}
.keyBox button,.themeBox button{width:100%;padding:10px;background:linear-gradient(135deg,var(--main),#0066ff);border:none;border-radius:10px;color:#fff;font-weight:bold;cursor:pointer;margin-top:6px}
.themes{display:flex;gap:8px;margin-top:10px}
.themes div{width:35px;height:35px;border-radius:50%;cursor:pointer;border:2px solid #fff}
</style>
