<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>POP ALMOZAG AI 👑</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f0f13;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}
header{background:#1a1a22;padding:12px;display:flex;justify-content:space-between;align-items:center;color:#ff4d5a;font-weight:bold;border-bottom:2px solid #ff4d5a}
.btns{display:flex;gap:6px} .icon{width:32px;height:32px;border-radius:8px;border:1px solid #ff4d5a;background:#222;display:grid;place-items:center;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:11px 14px;border-radius:16px;line-height:1.6;white-space:pre-wrap}
.user{align-self:flex-end;background:linear-gradient(135deg,#667eea,#764ba2)}
.ai{align-self:flex-start;background:#22232f;border:1px solid #333}
footer{display:flex;gap:8px;padding:10px;background:#1a1a22;border-top:1px solid #333;align-items:center}
#inp{flex:1;padding:12px 16px;border-radius:25px;border:none;background:#2a2a36;color:#fff;outline:none}
#send{padding:12px 18px;border-radius:25px;border:none;background:#ff4d5a;color:#fff;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<header><span>POP ALMOZAG AI 👑</span><div class="btns"><div class="icon" onclick="chat.innerHTML=''">🗑️</div><div class="icon" onclick="alert('شغال بدون مفتاح يا ملك 🔥')">⚙️</div></div></header>
<div id="chat"><div class="msg ai">أهلا يا ملك 👑
أنا POP ALMOZAG AI - النسخة الكاملة الشغالة بدون مفتاح
📷 ابعت صورة، 🔊 هرد عليك، 🎨 وكل حاجة شغالة 🔥</div></div>
<footer>
<label class="icon" for="file">📎</label><input id="file" type="file" accept="image/*" hidden>
<input id="inp" placeholder="اكتب رسالتك..."><button id="send" onclick="send()">➤</button>
</footer>
<script>
const chatEl=document.getElementById('chat'), inp=document.getElementById('inp');
let attachedImage='';
document.getElementById('file').addEventListener('change',e=>{
 const f=e.target.files[0]; if(!f) return;
 const r=new FileReader(); r.onload=()=>{attachedImage=`<br><img src='${r.result}' style='max-width:100%;border-radius:10px;margin-top:8px'>`; chatEl.innerHTML+=`<div class='msg user'>صورة مرفقة${attachedImage}</div>`; attachedImage='';}; r.readAsDataURL(f);
});
async function send(){
 let t=inp.value.trim(); if(!t) return;
 chatEl.innerHTML+=`<div class="msg user">${t}</div>`; inp.value=''; chatEl.scrollTop=chatEl.scrollHeight;
 let d=document.createElement('div'); d.className='msg ai'; d.textContent='بفكر...⏳'; chatEl.appendChild(d);
 try{
  let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(t+' - رد بالعربي العامي المصري كملك POP ALMOZAG'));
  d.textContent=await r.text();
  if('speechSynthesis' in window){ let u=new SpeechSynthesisUtterance(d.textContent); u.lang='ar-EG'; speechSynthesis.speak(u); }
 }catch(e){ d.textContent='النت ضعيف يا ملك، جرب تاني ❤️'; }
 chatEl.scrollTop=chatEl.scrollHeight;
}
inp.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
