
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#010a1e">
<title>POP ALMOZAG AI 👑</title>
<style>
:root{--main:#00d4ff;--bg:#010a1e;--card:#0a234a;--input:#001e3d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#fff;font-family:Arial,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{cursor:pointer;font-family:inherit}
.bg{position:fixed;inset:0;display:grid;place-items:center;font-size:clamp(30px,8vw,65px);font-weight:900;color:#00d4ff0c;transform:rotate(-25deg);pointer-events:none}
.header{position:relative;z-index:2;padding:10px;background:#001233;border-bottom:2px solid var(--main);display:flex;justify-content:space-between;align-items:center;gap:5px}
.header h1{color:var(--main);font-size:15px}
.tools{display:flex;gap:4px}
.hbtn,.icon{background:#0a1e3a;color:var(--main);border:1px solid var(--main);border-radius:10px;padding:8px}
.chat{position:relative;z-index:1;flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:90%;padding:12px;border-radius:16px;line-height:1.7;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.user{align-self:flex-start;background:linear-gradient(135deg,var(--main),#0066ff)}
.bot{align-self:flex-end;background:var(--card);border:1px solid #ffffff22}
.msg img{display:block;max-width:220px;max-height:220px;object-fit:contain;border-radius:10px;margin-top:8px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.actions button{padding:6px 8px;border-radius:8px;background:#001a3a;color:var(--main);border:1px solid #ffffff22}
.bottom{position:relative;z-index:2;background:#00102a;border-top:2px solid var(--main);padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.preview{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.previewItem{position:relative}
.preview img{width:55px;height:55px;object-fit:cover;border:2px solid var(--main);border-radius:8px}
.removeImg{position:absolute;top:-5px;left:-5px;border:0;border-radius:50%;background:#c00;color:white;width:21px;height:21px}
.bar{display:flex;gap:6px;align-items:flex-end}
.icon{width:40px;height:42px;flex-shrink:0;border-radius:50%;font-size:17px;padding:0}
.box{flex:1;min-width:0;background:var(--input);border:2px solid var(--main);border-radius:20px;padding:10px}
textarea{width:100%;background:transparent;color:white;border:0;outline:0;resize:none;font-size:15px;font-family:inherit;min-height:22px;max-height:100px}
.send{width:44px;height:44px;flex-shrink:0;border:0;border-radius:50%;color:white;background:linear-gradient(135deg,var(--main),#0066ff);font-size:19px}
.send:disabled{opacity:.5}
.popup{display:none;position:fixed;z-index:10;top:65px;left:12px;right:12px;max-width:420px;margin:auto;padding:15px;background:#001a3a;border:2px solid var(--main);border-radius:15px;box-shadow:0 10px 35px #0009}
.popup input,.popup select{width:100%;padding:10px;margin:8px 0;background:#000e2a;color:white;border:1px solid #ffffff33;border-radius:8px}
.popup button{width:100%;padding:10px;margin-top:6px;border:0;border-radius:8px;background:var(--main);color:#001233}
.themes{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.themes button{width:35px;height:35px;border:2px solid white;border-radius:50%;padding:0}
.status{text-align:center;color:#b9dbea;font-size:12px;padding:6px;white-space:pre-wrap}
.error{color:#ffaaaa}
@media(max-width:400px){.header h1{font-size:12px}.hbtn{padding:7px 6px}}
</style>
</head>
<body>

<div class="bg">POP ALMOZAG AI</div>

<header class="header">
<h1>👑 POP ALMOZAG AI</h1>
<div class="tools">
<button class="hbtn" id="themeOpen">🎨</button>
<button class="hbtn" id="exportBtn">📄</button>
<button class="hbtn" id="keyOpen">⚙️</button>
<button class="hbtn" id="clearBtn">🗑️</button>
</div>
</header>

<main class="chat" id="chat"></main>

<footer class="bottom">
<div class="preview" id="preview"></div>
<div class="bar">
<button class="send" id="mainBtn" title="إرسال أو تسجيل صوت">➤</button>
<div class="box">
<textarea id="inp" rows="1" placeholder="اكتب رسالتك..."></textarea>
</div>
<button class="icon" id="camBtn" title="اختيار صورة">📷</button>
<button class="icon" id="fileBtn" title="إرفاق صورة">📎</button>
</div>
</footer>

<input type="file" id="fileInp" accept="image/jpeg,image/png,image/webp" multiple hidden>

<div class="popup" id="keyBox">
<h3>🔑 إعدادات Gemini</h3>
<p style="font-size:12px;color:#b9c9dc;line-height:1.7;margin-top:8px">
أدخل مفتاح API الخاص بك. لا تنشر المفتاح داخل موقع عام.
</p>
<input id="keyInp" type="password" autocomplete="off" placeholder="مفتاح Gemini API">
<select id="modelInp">
<option value="gemini-2.5-flash">gemini-2.5-flash</option>
<option value="gemini-2.0-flash">gemini-2.0-flash</option>
</select>
<button id="saveKey">حفظ الإعدادات ✅</button>
<button data-close="keyBox" style="background:#333;color:white">إغلاق</button>
</div>

<div class="popup" id="themeBox">
<h3>🎨 اختار اللون</h3>
<div class="themes">
<button style="background:#00d4ff" data-theme="#00d4ff|#010a1e|#0a234a|#001e3d"></button>
<button style="background:#a855f7" data-theme="#a855f7|#0f031f|#2a1450|#1e1040"></button>
<button style="background:#22c55e" data-theme="#22c55e|#02120a|#0f2a1a|#0a1f14"></button>
<button style="background:#f59e0b" data-theme="#f59e0b|#1a1000|#3a2500|#2a1a00"></button>
<button style="background:#ef4444" data-theme="#ef4444|#1a0505|#3a0a0a|#2a0808"></button>
</div>
<button data-close="themeBox" style="background:#333;color:white">إغلاق</button>
</div>

<script>
(function(){
"use strict";

const $=id=>document.getElementById(id);
const chat=$("chat"),inp=$("inp"),preview=$("preview");
const fileInp=$("fileInp"),mainBtn=$("mainBtn");

const CHAT_KEY="pop_chat_v2";
const API_KEY="GEMINI_KEY";
const MODEL_KEY="POP_MODEL";
const THEME_KEY="pop_theme";

let apiKey=localStorage.getItem(API_KEY)||"";
let model=localStorage.getItem(MODEL_KEY)||"gemini-2.5-flash";
let messages=[];
let images=[];
let busy=false;
let recognition=null;
let isRecording=false;

$("keyInp").value=apiKey;
$("modelInp").value=model;

try{
const saved=JSON.parse(localStorage.getItem(CHAT_KEY)||"[]");
if(Array.isArray(saved))messages=saved;
}catch(e){messages=[];}

function status(text,isError){
const d=document.createElement("div");
d.className="status"+(isError?" error":"");
d.textContent=text;
chat.appendChild(d);
chat.scrollTop=chat.scrollHeight;
return d;
}

function saveMessages(){
try{
localStorage.setItem(CHAT_KEY,JSON.stringify(messages));
}catch(e){
status("تعذر حفظ المحادثة. قد تكون مساحة التخزين ممتلئة.",true);
}
}

function copyText(text){
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(text)
.then(()=>status("تم نسخ الرسالة ✅"))
.catch(()=>fallbackCopy(text));
}else fallbackCopy(text);
}

function fallbackCopy(text){
const t=document.createElement("textarea");
t.value=text;
document.body.appendChild(t);
t.select();
try{
document.execCommand("copy");
status("تم النسخ إذا كان المتصفح يسمح بذلك.");
}catch(e){status("تعذر النسخ.",true);}
t.remove();
}

function speakText(text){
if(!("speechSynthesis" in window)){
status("القراءة الصوتية غير مدعومة في هذا المتصفح.",true);
return;
}
speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(text);
u.lang="ar-EG";
u.rate=.95;
speechSynthesis.speak(u);
}

function renderMessage(m){
const d=document.createElement("article");
d.className="msg "+(m.role==="user"?"user":"bot");

const txt=document.createElement("div");
txt.textContent=m.text||"";
d.appendChild(txt);

(m.imgs||[]).forEach(src=>{
const im=document.createElement("img");
im.src=src;
im.alt="صورة مرفقة";
d.appendChild(im);
});

const actions=document.createElement("div");
actions.className="actions";

const copy=document.createElement("button");
copy.textContent="📋 نسخ";
copy.onclick=()=>copyText(m.text||"");
actions.appendChild(copy);

if(m.role==="bot"){
const speak=document.createElement("button");
speak.textContent="🔊 صوت";
speak.onclick=()=>speakText(m.text||"");
actions.appendChild(speak);
}

d.appendChild(actions);
chat.appendChild(d);
chat.scrollTop=chat.scrollHeight;
}

function renderAll(){
chat.innerHTML="";
if(messages.length===0){
const welcome=document.createElement("article");
welcome.className="msg bot";
welcome.textContent="أهلاً يا ملك 👑\nأنا POP ALMOZAG AI.\n\nافتح ⚙️ وأضف مفتاح Gemini لتبدأ المحادثة.\n📷 لإرفاق الصور، 🎨 لتغيير الألوان.";
chat.appendChild(welcome);
}else{
messages.forEach(renderMessage);
}
}

function addMessage(role,text,imgs){
const m={role:role,text:text,imgs:imgs||[]};
messages.push(m);
saveMessages();
renderMessage(m);
}

function updatePreview(){
preview.innerHTML="";
images.forEach((im,index)=>{
const wrap=document.createElement("div");
wrap.className="previewItem";
const pic=document.createElement("img");
pic.src=im.url;
pic.alt="معاينة الصورة";

const remove=document.createElement("button");
remove.className="removeImg";
remove.textContent="×";
remove.onclick=()=>{
images.splice(index,1);
updatePreview();
};

wrap.appendChild(pic);
wrap.appendChild(remove);
preview.appendChild(wrap);
});
}

function openPopup(id){
document.querySelectorAll(".popup").forEach(p=>p.style.display="none");
$(id).style.display="block";
}

function closePopup(id){
$(id).style.display="none";
}

function changeTheme(parts){
const [main,bg,card,input]=parts;
const root=document.documentElement;
root.style.setProperty("--main",main);
root.style.setProperty("--bg",bg);
root.style.setProperty("--card",card);
root.style.setProperty("--input",input);
try{
localStorage.setItem(THEME_KEY,JSON.stringify({main,bg,card,input}));
}catch(e){}
}

try{
const theme=JSON.parse(localStorage.getItem(THEME_KEY)||"null");
if(theme)changeTheme([theme.main,theme.bg,theme.card,theme.input]);
}catch(e){}

$("keyOpen").onclick=()=>openPopup("keyBox");
$("themeOpen").onclick=()=>openPopup("themeBox");

document.querySelectorAll("[data-close]").forEach(btn=>{
btn.onclick=()=>closePopup(btn.dataset.close);
});

document.querySelectorAll("[data-theme]").forEach(btn=>{
btn.onclick=()=>{
changeTheme(btn.dataset.theme.split("|"));
closePopup("themeBox");
};
});

$("saveKey").onclick=()=>{
apiKey=$("keyInp").value.trim();
model=$("modelInp").value;

try{
if(apiKey)localStorage.setItem(API_KEY,apiKey);
else localStorage.removeItem(API_KEY);
localStorage.setItem(MODEL_KEY,model);
}catch(e){}

closePopup("keyBox");

status(apiKey?
"تم حفظ الإعدادات على هذا الجهاز.":"أضف مفتاح API قبل إرسال الرسائل.",
!apiKey);
};

$("clearBtn").onclick=()=>{
if(confirm("هل تريد مسح كل المحادثة؟")){
messages=[];
saveMessages();
renderAll();
}
};

$("exportBtn").onclick=()=>{
const text=messages.map(m=>
(m.role==="user"?"أنت: ":"POP: ")+(m.text||"")
).join("\n\n");

const blob=new Blob([text],{type:"text/plain;charset=utf-8"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download="POP-ALMOZAG-Chat.txt";
a.click();
setTimeout(()=>URL.revokeObjectURL(url),1000);
};

$("fileBtn").onclick=()=>$("fileInp").click();
$("camBtn").onclick=()=>$("fileInp").click();

fileInp.onchange=async function(event){
const files=Array.from(event.target.files||[]);

for(const file of files){
if(!file.type.startsWith("image/"))continue;

if(file.size>7*1024*1024){
status("حجم الصورة أكبر من 7 ميجابايت. اختر صورة أصغر.",true);
continue;
}

try{
const dataUrl=await new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onload=()=>resolve(reader.result);
reader.onerror=reject;
reader.readAsDataURL(file);
});

const comma=dataUrl.indexOf(",");
images.push({
data:dataUrl.slice(comma+1),
mime:file.type,
url:dataUrl
});
}catch(e){
status("تعذرت قراءة الصورة.",true);
}
}

updatePreview();
fileInp.value="";
};

inp.addEventListener("input",()=>{
inp.style.height="22px";
inp.style.height=Math.min(inp.scrollHeight,100)+"px";
});

inp.addEventListener("keydown",event=>{
if(event.key==="Enter"&&!event.shiftKey){
event.preventDefault();
sendMessage();
}
});

mainBtn.onclick=()=>{
if(isRecording){
try{recognition.stop();}catch(e){}
return;
}

if(inp.value.trim()||images.length){
sendMessage();
}else{
startVoice();
}
};

function startVoice(){
const SpeechRecognition=
window.SpeechRecognition||window.webkitSpeechRecognition;

if(!SpeechRecognition){
status("التعرف على الكلام غير مدعوم في هذا المتصفح. اكتب رسالتك بدلًا منه.",true);
return;
}

recognition=new SpeechRecognition();
recognition.lang="ar-EG";
recognition.interimResults=false;
recognition.maxAlternatives=1;

recognition.onstart=()=>{
isRecording=true;
mainBtn.textContent="■";
status("الميكروفون يعمل. تكلم الآن ثم اضغط إيقاف.");
};

recognition.onresult=event=>{
const result=event.results[0][0].transcript;
inp.value=(inp.value+" "+result).trim();
inp.dispatchEvent(new Event("input"));
};

recognition.onerror=event=>{
status("تعذر تشغيل الميكروفون: "+event.error,true);
};

recognition.onend=()=>{
isRecording=false;
mainBtn.textContent="➤";
};

try{
recognition.start();
}catch(e){
status("تعذر بدء الميكروفون. تحقق من إذن المتصفح.",true);
}
}

function getApiHistory(){
return messages.slice(-16).map(m=>({
role:m.role==="bot"?"model":"user",
parts:[{text:String(m.text||"")}]
}));
}

async function sendMessage(){
if(busy)return;

const text=inp.value.trim();
if(!text&&!images.length)return;

if(!apiKey){
openPopup("keyBox");
status("أضف مفتاح Gemini من الإعدادات أولًا.",true);
return;
}

const selectedImages=images.slice();
const shownImages=selectedImages.map(im=>im.url);

addMessage("user",text||"حلّل الصورة المرفقة.",shownImages);

inp.value="";
inp.style.height="22px";
images=[];
updatePreview();

busy=true;
mainBtn.disabled=true;
mainBtn.textContent="…";

const waiting=status("جاري الاتصال بـ Gemini…");

try{
const contents=getApiHistory();
const last=contents[contents.length-1];

selectedImages.forEach(im=>{
last.parts.push({
inline_data:{
mime_type:im.mime,
data:im.data
}
});
});

const response=await fetch(
"https://generativelanguage.googleapis.com/v1beta/models/"+
encodeURIComponent(model)+":generateContent",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"x-goog-api-key":apiKey
},
body:JSON.stringify({
contents:contents,
generationConfig:{
temperature:0.7,
maxOutputTokens:2048
}
})
}
);

let data={};
try{data=await response.json();}catch(e){}

if(!response.ok){
const message=data.error&&data.error.message?
data.error.message:"HTTP "+response.status;
throw new Error(message);
}

const answer=(data.candidates||[])
.flatMap(c=>c.content&&c.content.parts?c.content.parts:[])
.map(p=>p.text||"")
.join("")
.trim();

if(!answer){
throw new Error("وصل رد فارغ من الموديل. جرّب سؤالًا آخر.");
}

waiting.remove();
addMessage("bot",answer);

}catch(error){
waiting.remove();
status(
"فشل الاتصال: "+(error.message||"خطأ غير معروف")+
"\nتحقق من الإنترنت والمفتاح واسم الموديل.",
true
);
}finally{
busy=false;
mainBtn.disabled=false;
mainBtn.textContent="➤";
inp.focus();
}
}

renderAll();
})();
</script>
</body>
</html>
