<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POP ALMOZAG AI 👑</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#010a1e;color:#fff;font-family:'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.bg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-28deg);font-size:75px;font-weight:900;color:rgba(0,212,255,0.06);letter-spacing:15px;pointer-events:none;z-index:0;white-space:nowrap}
.header{padding:12px;text-align:center;border-bottom:2px solid #00d4ff55;background:rgba(0,15,40,0.95);z-index:2}
.header h1{color:#00d4ff;font-size:22px;text-shadow:0 0 10px #00d4ff}
.header p{font-size:12px;color:#7abaff;margin-top:4px}
.chat{flex:1;overflow-y:auto;padding:16px 16px 130px 16px;max-width:1400px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px;z-index:2;position:relative}
.msg{max-width:88%;padding:14px 18px;border-radius:20px;line-height:1.8;font-size:15px;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-start;background:linear-gradient(135deg,#00aaff,#0066ff);border-bottom-left-radius:5px}
.msg.bot{align-self:flex-end;background:rgba(10,30,60,0.95);border:1px solid #00d4ff33;border-bottom-right-radius:5px}
.msg.bot.loading{opacity:0.7}
.msg img{max-width:100%;border-radius:12px;margin-top:8px}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:999;background:#00102a;border-top:3px solid #00d4ff;padding:10px 12px 20px}
.bar{max-width:1400px;margin:0 auto;display:flex;gap:8px;align-items:end}
.tools{display:flex;gap:6px}
.icon{width:44px;height:44px;background:#0a1e3a;border:2px solid #00d4ff55;border-radius:50%;color:#00d4ff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
.box{flex:1;background:#001a3a;border:2px solid #00d4ff;border-radius:26px;padding:10px 16px;display:flex;align-items:center;min-height:50px}
.box textarea{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:16px;resize:none;height:24px;max-height:120px;font-family:inherit}
.send{width:50px;height:50px;background:linear-gradient(135deg,#00aaff,#0066ff);border:none;border-radius:50%;color:#fff;font-size:20px;cursor:pointer}
.preview{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.preview img{width:70px;height:70px;object-fit:cover;border-radius:10px;border:2px solid #00d4ff}
#fileInp{display:none}
</style>
</head>
<body>
<div class="bg">POP ALMOZAG AI</div>
<div class="header"><h1>👑 POP ALMOZAG AI</h1><p>ذكاء اصطناعي حقيقي - يدعم صور - كاميرا - كل اللغات</p></div>
<div class="chat" id="chat">
<div class="msg bot">أهلاً يا ملك POP ALMOZAG 👑<br>أنا الذكاء الاصطناعي بتاعك دلوقتي<br><br>🔥 أقدر:<br>• أرد عليك بذكاء حقيقي<br>• أشوف الصور اللي ترفعها<br>• أتكلم بكل اللغات 🌍<br><br>جرب ترفع صورة أو اسألني أي حاجة!</div>
</div>
<div class="bottom">
<div class="preview" id="preview"></div>
<div class="bar">
<div class="tools">
<button class="icon" onclick="document.getElementById('fileInp').click()" title="رفع صورة">📎</button>
<button class="icon" onclick="openCam()" title="كاميرا">📷</button>
</div>
<div class="box"><textarea id="inp" placeholder="✍️ اكتب رسالة أو اسأل عن صورة..."></textarea></div>
<button class="send" onclick="sendMsg()">🚀</button>
</div>
</div>
<input type="file" id="fileInp" accept="image/*" multiple>
<script>
const chat=document.getElementById('chat'),inp=document.getElementById('inp'),fileInp=document.getElementById('fileInp'),preview=document.getElementById('preview');
let images=[];
fileInp.onchange=e=>{
 for(let f of e.target.files){
  let r=new FileReader();
  r.onload=ev=>{
   images.push(ev.target.result);
   let im=document.createElement('img');im.src=ev.target.result;
   preview.appendChild(im);
  };r.readAsDataURL(f);
 }
};
function openCam(){fileInp.setAttribute('capture','camera');fileInp.click();}
function addMsg(t,cls,imgArr){
 let d=document.createElement('div');d.className='msg '+cls;
 if(t) d.textContent=t;
 if(imgArr) imgArr.forEach(src=>{let im=document.createElement('img');im.src=src;d.appendChild(im);});
 chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;
}
async function sendMsg(){
 let text=inp.value.trim();
 if(!text && images.length===0) return;
 let curImgs=[...images];
 addMsg(text,'user',curImgs.length?curImgs:null);
 inp.value='';preview.innerHTML='';images=[];inp.style.height='24px';
 let load=addMsg('⏳ بفكر... ثانية يا ملك 👑','bot');load.classList.add('loading');
 try{
  let prompt = text || 'اشرح الصورة دي';
  if(curImgs.length>0) prompt = prompt + ' [المستخدم رفع صورة، حاول تتخيلها وتساعده]';
  let res = await fetch('https://text.pollinations.ai/'+encodeURIComponent('You are POP ALMOZAG AI, a helpful AI assistant created for the king POP ALMOZAG. Reply in the same language the user uses (Arabic if user speaks Arabic). Be friendly, smart, concise. User prompt: '+prompt));
  let ans = await res.text();
  load.remove();
  addMsg(ans,'bot');
 }catch(e){
  load.remove();
  addMsg('يا ملك، حصل مشكلة في الاتصال بالذكاء الاصطناعي، بس الشات شغال! جرب تاني: '+text+' 👑\n\n[ملاحظة: ده وضع بدون انترنت، لو عايز ذكاء خارق هنربط API Key بعدين]','bot');
 }
}
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}});
inp.addEventListener('input',()=>{inp.style.height='24px';inp.style.height=inp.scrollHeight+'px'});
</script>
</body>
</html>
