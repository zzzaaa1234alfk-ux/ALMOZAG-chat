<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POP ALMOZAG AI 👑</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000510;color:#e6e6e6;font-family:'Segoe UI',Tahoma,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;position:relative}
body::before{content:"POP ALMOZAG AI";position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-25deg);font-size:80px;font-weight:900;color:rgba(0,212,255,0.07);letter-spacing:10px;z-index:0;pointer-events:none;white-space:nowrap}
.login{position:fixed;inset:0;background:radial-gradient(ellipse at top,#0a1930 0%,#000510 70%);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:rgba(0,20,40,0.95);border:2px solid rgba(0,212,255,0.4);border-radius:24px;padding:30px 24px;width:100%;max-width:360px;text-align:center;box-shadow:0 0 40px rgba(0,212,255,0.2)}
.login-box h1{color:#00d4ff;font-size:26px;text-shadow:0 0 15px #00d4ff}
.login-btn{width:100%;padding:13px;border-radius:14px;border:1px solid rgba(0,212,255,0.3);background:#001122;color:white;margin:8px 0;cursor:pointer;font-size:14px}
.login-btn.google{background:white;color:black;font-weight:600}
.skip{color:#00d4ff;font-size:14px;margin-top:16px;cursor:pointer;display:inline-block;border-bottom:1px dashed #00d4ff}
.header{position:relative;z-index:1;padding:12px;text-align:center;border-bottom:1px solid rgba(0,212,255,0.2);background:rgba(0,5,20,0.9)}
.header h2{color:#00d4ff;font-size:22px;text-shadow:0 0 10px #00d4ff}
.topics{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.topic{background:rgba(0,25,48,0.9);border:1px solid rgba(0,212,255,0.3);color:#00d4ff;padding:6px 12px;border-radius:20px;font-size:11px;cursor:pointer}
.chat{position:relative;z-index:1;flex:1;overflow-y:auto;padding:14px 14px 110px 14px;display:flex;flex-direction:column;gap:10px;max-width:1400px;margin:0 auto;width:100%}
.msg{max-width:90%;padding:12px 16px;border-radius:20px;line-height:1.8;font-size:15px;white-space:pre-wrap;word-wrap:break-word;cursor:pointer}
.msg.user{align-self:flex-start;background:linear-gradient(135deg,#00aaff,#0066ff);color:white;border-bottom-left-radius:4px}
.msg.bot{align-self:flex-end;background:rgba(0,20,40,0.9);border:1px solid rgba(0,212,255,0.2);border-bottom-right-radius:4px}
.msg.selected{outline:2px solid #00d4ff;box-shadow:0 0 15px rgba(0,212,255,0.4)}
