<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POP ALMOZAG AI</title>
<style>
body{margin:0;background:#020a1a;color:#fff;font-family:sans-serif;height:100vh;display:flex;flex-direction:column}
.bg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-25deg);font-size:60px;font-weight:900;color:#00d4ff22;letter-spacing:10px;pointer-events:none}
.head{padding:15px;text-align:center;border-bottom:2px solid #00d4ff;background:#000e2a;z-index:2}
.head h1{color:#00d4ff;margin:0;font-size:22px}
.chat{flex:1;overflow:auto;padding:15px;padding-bottom:100px;z-index:2}
.msg{padding:12px 16px;border-radius:18px;margin:8px 0;max-width:85%}
.user{background:linear-gradient(135deg,#00aaff,#0066ff);align-self:flex-start}
.bot{background:#0a1e3a;border:1px solid #00d4ff44;align-self:flex-end;margin-left:auto}
.bar{position:fixed;bottom:0;left:0;right:0;background:#00102e;border-top:3px solid #00d4ff;padding:12px;display:flex;gap:10px;z-index:999}
.bar input{flex:1;padding:14px 18px;border-radius:30px;border:2px solid #00d4ff;background:#001a33;color:#fff;font-size:16px;outline:none}
.bar button{width:55px;height:55px;border-radius:50%;border:none;background:linear-gradient(135deg,#00aaff,#0066ff);color:#fff;font-size:22px}
</style>
</head>
<body>
<div class="bg">ALMOZA</div>
<div class="head"><h1>👑 POP ALMOZAG AI</h1></div>
<div class="chat" id="c">
<div class="msg bot">أهلاً يا ملك 👑 الشات شغال 100% ومكان الكتابة تحت ثابت</div>
<div class="msg user">أهلاً وسهلاً</div>
</div>
<div class="bar">
<input id="i" placeholder="✍️ اكتب هنا...">
<button onclick="send()">🚀</button>
</div>
<script>
function send(){let e=document.getElementById('i'),v=e.value.trim(),c=document.getElementById('c');if(!v)return;let d=document.createElement('div');d.className='msg user';d.textContent=v;c.appendChild(d);e.value='';c.scrollTop=c.scrollHeight;setTimeout(()=>{let r=document.createElement('div');r.className='msg bot';r.textContent='تمام يا ملك استلمت: '+v+' ✅ الشات شغال';c.appendChild(r);c.scrollTop=c.scrollHeight},400)}
document.getElementById('i').addEventListener('keydown',e=>{if(e.key==='Enter')send()})
</script>
</body>
</html>
