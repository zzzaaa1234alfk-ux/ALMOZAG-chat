<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POP ALMOZAG AI 👑</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000510;color:#e6e6e6;font-family:'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;position:relative}
body::before{content:"POP ALMOZAG AI\A POP ALMOZAG AI";white-space:pre;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-25deg);font-size:70px;font-weight:900;color:rgba(0,212,255,0.06);letter-spacing:8px;line-height:1.5;z-index:0;pointer-events:none}
/* LOGIN */
.login{position:fixed;inset:0;background:radial-gradient(ellipse at top,#0a1930 0%,#000510 70%);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:rgba(0,20,40,0.9);border:2px solid rgba(0,212,255,0.3);border-radius:24px;padding:30px 24px;width:100%;max-width:360px;text-align:center;box-shadow:0 0 40px rgba(0,212,255,0.15)}
.login-box h1{color:#00d4ff;font-size:26px;text-shadow:0 0 15px #00d4ff}
.login-box p{color:#00ff88;font-size:12px;margin:8px 0 20px}
.login-btn{width:100%;padding:12px;border-radius:14px;border:1px solid rgba(0,212,255,0.3);background:#001122;color:white;margin:8px 0;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.login-btn.google{background:white;color:black}
.login-btn:hover{transform:scale(1.02);box-shadow:0 0 15px rgba(0,212,255,0.3)}
.skip{color:#00d4ff;font-size:13px;margin-top:14px;cursor:pointer;display:inline-block;border-bottom:1px dashed #00d4ff}
.lang-sel{position:absolute;top:14px;left:14px;background:#001122;border:1px solid rgba(0,212,255,0.3);color:#00d4ff;padding:6px 10px;border-radius:20px;font-size:12px;cursor:pointer}
/* HEADER */
.header{position:relative;z-index:1;padding:12px;text-align:center;border-bottom:1px solid rgba(0,212,255,0.2);background:rgba(0,5,20,0.85);backdrop-filter:blur(8px)}
.header h2{color:#00d4ff;font-size:22px;text-shadow:0 0 10px #00d4ff}
.topics{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.topic{background:rgba(0,25,48,0.8);border:1px solid rgba(0,212,255,0.3);color:#00d4ff;padding:5px 10px;border-radius:20px;font-size:11px;cursor:pointer}
.chat{position:relative;z-index:1;flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;max-width:1400px;margin:0 auto;width:100%}
.msg{max-width:92%;padding:12px 16px;border-radius:20px;line-height:1.8;font-size:15px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;cursor:pointer}
.msg.user{align-self:flex-start;background:linear-gradient(135deg,#00aaff,#0066ff);color:white;border-bottom-left-radius:4px}
.msg.bot{align-self:flex-end;background:rgba(0,20,40,0.85);border:1px solid rgba(0,212,255,0.15);border-bottom-right-radius:4px}
.msg.selected{outline:2px solid #00d4ff;box-shadow:0 0 15px rgba(0,212,255,0.4)}
.quote{background:rgba(0,212,255,0.12);border-right:3px solid #00d4ff;padding:6px 10px;border-radius:8px;margin-bottom:6px;font-size:12px;color:#88d8ff}
.quote::before{content:"● ";color:#00d4ff}
.reply-bar{display:none;background:rgba(0,20,40,0.95);border-right:3px solid #00d4ff;padding:8px 12px;border-radius:10px;margin:0 auto 6px;max-width:1400px;width:100%;z-index:1;position:relative;justify-content:space-between}
.reply-bar.on{display:flex}
.bottom{position:relative;z-index:1;padding:10px 12px 22px;background:rgba(0,8,20,0.95);border-top:1px solid rgba(0,212,255,0.2)}
.input-wrap{max-width:1400px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.input-box{flex:1;background:#001122;border:2px solid rgba(0,212,255,0.4);border-radius:28px;display:flex;align-items:flex-end;padding:6px 12px;gap:6px}
textarea{flex:1;background:transparent;border:none;outline:none;color:white;font-size:15px;resize:none;min-height:24px;max-height:120px;font-family:inherit}
.icon-btn{width:42px;height:42px;background:#0a1930;border:1px solid rgba(0,212,255,0.3);border-radius:50%;color:#00d4ff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.send{width:46px;height:46px;background:linear-gradient(135deg,#00aaff,#0066ff);border:none;border-radius:50%;color:white;font-size:18px;cursor:pointer}
.preview{display:none;gap:8px;flex-wrap:wrap;padding:8px;max-width:1400px;margin:0 auto;width:100%;z-index:1;position:relative}
.preview-item{position:relative;width:70px;height:70px;border-radius:10px;overflow:hidden;border:2px solid #00d4ff}
.preview-item img{width:100%;height:100%;object-fit:cover}
#fileInput,#video,#canvas{display:none}
#video{position:fixed;top:80px;left:50%;transform:translateX(-50%);width:90%;max-width:430px;border-radius:20px;border:3px solid #00d4ff;z-index:9999}
</style>
</head>
<body>

<div class="login" id="login">
<div class="lang-sel" onclick="toggleLang()">🌐 <span id="langLabel">عربي</span></div>
<div class="login-box">
<h1>POP ALMOZAG AI 👑</h1>
<p>شات ذكاء اصطناعي شامل • يدعم جميع اللغات</p>
<button class="login-btn google" onclick="enter()">🌈 Continue with Google</button>
<button class="login-btn" onclick="enter()">📧 Continue with Email</button>
<div class="skip" onclick="enter()">Skip for now → تخطي</div>
<p style="font-size:10px;color:#5a7a8a;margin-top:12px">يدعم العربية • English • Français • Español • وجميع اللغات</p>
</div>
</div>

<div class="header">
<h2>POP ALMOZAG AI 👑</h2>
<div class="topics">
<span class="topic" onclick="q('Computer Vision')">Computer Vision 👁️</span>
<span class="topic" onclick="q('Deep Learning')">Deep Learning 🧠</span>
<span class="topic" onclick="q('Machine Learning')">Machine Learning 🤖</span>
<span class="topic" onclick="q('Coding')">Coding 💻</span>
</div>
</div>

<div class="chat" id="chat">
<div class="msg bot">POP ALMOZAG يكتب... اهلا وسهلا يا ملك 👑</div>
<div class="msg user">اهلا وسهلا</div>
</div>

<div class="reply-bar" id="replyBar"><div id="replyTxt" style="font-size:13px;color:#88d8ff"></div><button onclick="cancelReply()" style="background:none;border:none;color:white;cursor:pointer">✕</button></div>
<div class="preview" id="preview"></div>

<div class="bottom">
<div class="input-wrap">
<button class="icon-btn" onclick="document.getElementById('fileInput').click()">📎</button>
<button class="icon-btn" onclick="openCam()">📷</button>
<div class="input-box"><textarea id="inp" placeholder="✍️ اكتب بأي لغة..." rows="1" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea></div>
<button class="send" onclick="send()">🚀</button>
</div>
</div>

<input type="file" id="fileInput" accept="image/*" multiple onchange="handleFiles(this.files)">
<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
let imgs=[],sel=null,replyTo=null,lang='ar';
let chat=document.getElementById('chat'),inp=document.getElementById('inp'),preview=document.getElementById('preview');
function toggleLang(){lang=lang==='ar'?'en':'ar';document.getElementById('langLabel').innerText=lang==='ar'?'عربي':'EN';inp.placeholder=lang==='ar'?'✍️ اكتب بأي لغة...':'✍️ Write in any language...';}
function enter(){document.getElementById('login').style.display='none'}
function q(t){inp.value=t;send()}
function handleFiles(f){for(let file of f){let r=new FileReader();r.onload=e=>{imgs.push(e.target.result);show()};r.readAsDataURL(file)}}
function show(){preview.style.display=imgs.length?'flex':'none';preview.innerHTML='';imgs.forEach((s,i)=>{let d=document.createElement('div');d.className='preview-item';d.innerHTML=`<img src="${s}"><button onclick="imgs.splice(${i},1);show()" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.7);color:white;border:none;width:18px;height:18px;border-radius:50%;font-size:10px">✕</button>`;preview.appendChild(d)})}
async function openCam(){let v=document.getElementById('video');try{let st=await navigator.mediaDevices.getUserMedia({video:true});v.srcObject=st;v.style.display='block';let b=document.createElement('button');b.textContent='📸 التقط';b.style.cssText='position:fixed;bottom:110px;left:50%;transform:translateX(-50%);z-index:10000;background:#00aaff;color:white;border:none;padding:12px 24px;border-radius:25px;cursor:pointer';document.body.appendChild(b);b.onclick=()=>{let c=document.getElementById('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);imgs.push(c.toDataURL());show();st.getTracks().forEach(t=>t.stop());v.style.display='none';b.remove()}}catch(e){alert('الكاميرا غير متاحة')}}
function add(text,type,ims=[],quoted=null){
  let d=document.createElement('div');d.className='msg '+type;
  let h='';if(quoted)h+=`<div class="quote">${quoted.substring(0,80)}</div>`;
  ims.forEach(s=>h+=`<img src="${s}" style="max-width:100%;border-radius:12px;margin-top:6px">`);
  h+=`<div>${text}</div>`;d.innerHTML=h;
  d.onclick=()=>{document.querySelectorAll('.msg').forEach(m=>m.classList.remove('selected'));sel=d;d.classList.add('selected');};
  d.ondblclick=()=>{sel=d;doReply()};
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;
}
function doReply(){if(!sel)return;replyTo=sel.innerText;document.getElementById('replyTxt').innerHTML='● ترد على: '+replyTo.substring(0,60);document.getElementById('replyBar').classList.add('on');sel.classList.remove('selected')}
function cancelReply(){replyTo=null;document.getElementById('replyBar').classList.remove('on')}
function detect(t){if(/[ا-ي]/.test(t))return 'ar';return 'en'}
function send(){
  let t=inp.value.trim();if(!t&&!imgs.length)return;
  let cp=[...imgs],q=replyTo;let l=detect(t);add(t||'📸 صورة','user',cp,q);inp.value='';imgs=[];show();cancelReply();
  setTimeout(()=>{
    let rep='';
    if(cp.length) rep=l==='ar'?`استلمت الصورة يا ملك 👑📸\n● أقدر أعدلها، أشرحها، أحولها لكود`:`Got the image King 👑📸\n● I can edit, explain, convert to code`;
    else rep=l==='ar'?`أهلاً يا ملك 👑\n"${t}"\n● شاشة عريضة ✅\n● رد كامل ✅\n● اسمك في الخلفية ✅\n● كاميرا + صور ✅\n● رد بنقطة زي واتساب ✅\n● يدعم جميع اللغات 🌍`:`Hello King 👑\n"${t}"\n● Wide screen ✅\n● Full response ✅\n● Watermark ✅\n● Camera + Images ✅\n● Reply with dot ✅\n● All languages 🌍`;
    add(rep,'bot');
  },500);
}
</script>
</body>
</html>
